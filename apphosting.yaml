# ==============================================================================
# FIREBASE APP HOSTING CONFIGURATION (Sintesa / Teknopark & Techno Sign)
# ==============================================================================
# Dokumentasi Resmi: https://firebase.google.com/docs/app-hosting/configure
# File ini mendefinisikan resource container Cloud Run dan environment variables
# untuk deployment Next.js 14 di Firebase App Hosting.
# ==============================================================================

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # --- Konfigurasi Publik Firebase Client SDK ---
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyANnKv_e3rr1n03t3RVNrWkJ3yt6zUE5s4"

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "katalog-solo-technopark.firebaseapp.com"

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "katalog-solo-technopark"

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "katalog-solo-technopark.firebasestorage.app"

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "154366018751"

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:154366018751:web:01be834a899e07bd87f20a"

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-ESPXTW90XV"

  # --- Isolasi Multi-Database Presensi Pegawai Solo Technopark ---
  - variable: NEXT_PUBLIC_PRESENSI_DATABASE_ID
    value: "presensi-pegawai"

  - variable: NEXT_PUBLIC_PRESENSI_STORAGE_BUCKET
    value: "presensi-solo-technopark"

  # --- Titik Geofencing Kawasan STP (Centroid) ---
  - variable: NEXT_PUBLIC_OFFICE_LAT
    value: "-7.558778"

  - variable: NEXT_PUBLIC_OFFICE_LNG
    value: "110.855913"

  - variable: NEXT_PUBLIC_OFFICE_RADIUS_METERS
    value: "150"

  # --- URL Domain Resmi ---
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://katalog.solotechnopark.id"

  - variable: NEXT_PUBLIC_PRESENSI_URL
    value: "https://katalog.solotechnopark.id/presensi"

  # --- Konfigurasi Server-Side Firebase Admin SDK ---
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: "katalog-solo-technopark"

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    value: "firebase-adminsdk-fbsvc@katalog-solo-technopark.iam.gserviceaccount.com"

  - variable: PRESENSI_DEFAULT_PASSWORD
    value: "StpUser2026!"

  - variable: CLARIO_BASE_URL
    value: "https://clario.apicloud.my.id/v1"

  - variable: CLARIO_BACKUP_BASE_URL
    value: "https://clario.apicloud.my.id/v1"

  # ============================================================================
  # RAHASIA / SECRETS (Wajib diisi di Firebase Console > App Hosting > Secrets
  # atau Google Cloud Secret Manager):
  # 1. FIREBASE_ADMIN_PRIVATE_KEY
  #    (Private key RSA dari service-account-katalog.json)
  #    ATAU isi FIREBASE_SERVICE_ACCOUNT_KEY dengan seluruh isi JSON
  # 2. CLARIO_API_KEY (sk-clario-...)
  # ============================================================================
